[package]
name = "handy-dictation-target-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.61.3", features = ["Win32_Graphics_Gdi", "Win32_Security", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse"] }
