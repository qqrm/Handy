[package]
name = "handy-media-control-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the production media-control modules without the Tauri / inference
# build dependencies. Windows CI also type-checks and links the WinRT adapter.
[lib]
path = "lib.rs"

[dependencies]
log = "0.4.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.4.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.61.3", features = [
  "Media_Playback", "Media_Core", "Media_Editing", "Media_MediaProperties",
  "UI", "Win32_UI_Shell",
] }
