name: "Main Branch Build"

# Runs the full cross-platform build on every push to main so breakage is
# caught before a manual release is triggered. Upstream retains installers;
# this fork validates them without consuming retained artifact storage.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: ${{ github.repository == 'cjpais/Handy' }}
      sign-binaries: ${{ github.repository == 'cjpais/Handy' }}
      artifact-only: ${{ github.repository != 'cjpais/Handy' }}
    secrets:
      APPLE_ID: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.APPLE_ID || '' }}
      APPLE_ID_PASSWORD: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.APPLE_ID_PASSWORD || '' }}
      APPLE_PASSWORD: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}
      APPLE_CERTIFICATE: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      KEYCHAIN_PASSWORD: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'macos') && secrets.KEYCHAIN_PASSWORD || '' }}
      AZURE_CLIENT_ID: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'windows') && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'windows') && secrets.AZURE_CLIENT_SECRET || '' }}
      AZURE_TENANT_ID: ${{ github.repository == 'cjpais/Handy' && startsWith(matrix.platform, 'windows') && secrets.AZURE_TENANT_ID || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ github.repository == 'cjpais/Handy' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.repository == 'cjpais/Handy' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
