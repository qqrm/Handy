name: Gitleaks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' "$archive" | sha256sum --check --strict
          tar --extract --gzip --no-same-owner --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan full history including merges
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" detect --redact --exit-code=2 \
            --report-format=sarif --report-path=results.sarif \
            --log-opts='--all --full-history -m --text --no-textconv --no-ext-diff'
