name: Fork artifact packaging

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/build-policy*"
      - "src-tauri/tauri*.conf.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/ci/build-policy.test.mjs

  windows-artifact:
    needs: build-policy
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-2025
      target: x86_64-pc-windows-msvc
      artifact-only: true
      sign-binaries: false
      upload-artifacts: false
      asset-prefix: handy-pr
